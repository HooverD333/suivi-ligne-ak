<script>
(function(){
  var KEYSTORE='suiviLignePro.cle', E=document.getElementById('enc'), C=crypto.subtle;
  var SALT=E.getAttribute('data-salt'), ITER=+E.getAttribute('data-iter');
  function b2u(b){var s=atob(b),u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}
  function u2b(u){var s='',i;for(i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s);}
  function $(i){return document.getElementById(i);}
  function derive(pw){return C.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']).then(function(k){
    return C.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:b2u(SALT),iterations:ITER},k,{name:'AES-GCM',length:256},true,['decrypt']);});}
  function open(key){
    return C.decrypt({name:'AES-GCM',iv:b2u(E.getAttribute('data-iv'))},key,b2u(E.textContent.trim())).then(function(buf){
      return new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    }).then(function(html){
      // remplace la page de connexion par l'application (même adresse : #ecran, localStorage conservés)
      setTimeout(function(){document.open();document.write(html);document.close();},0);
      return true;
    });
  }
  function busy(b,msg){$('go').disabled=b;$('pw').disabled=b;$('go').textContent=b?(msg||'Ouverture…'):'Entrer';}
  $('f').addEventListener('submit',function(ev){
    ev.preventDefault();var pw=$('pw').value;$('err').textContent='';if(!pw){$('pw').focus();return;}
    busy(true);var key;
    derive(pw).then(function(k){key=k;return open(k).then(function(){return k;});}).then(function(k){
      if($('rm').checked)return C.exportKey('raw',k).then(function(raw){try{localStorage.setItem(KEYSTORE,JSON.stringify({salt:SALT,k:u2b(new Uint8Array(raw))}));}catch(e){}});
      else{try{localStorage.removeItem(KEYSTORE);}catch(e){}}
    }).catch(function(){busy(false);$('err').textContent='Mot de passe incorrect';$('pw').select();});
  });
  // clé mémorisée sur cet appareil (la clé dérivée, jamais le mot de passe)
  var st=null;try{st=JSON.parse(localStorage.getItem(KEYSTORE)||'null');}catch(e){}
  if(st&&st.salt===SALT&&st.k){
    busy(true);
    C.importKey('raw',b2u(st.k),{name:'AES-GCM'},false,['decrypt']).then(open).catch(function(){
      try{localStorage.removeItem(KEYSTORE);}catch(e){}busy(false);
    });
  }else if(st){try{localStorage.removeItem(KEYSTORE);}catch(e){}}
})();
</script>
